version: "3.8"

services:
  postgres:
    image: postgres:16-alpine
    container_name: redes-postgres
    environment:
      POSTGRES_DB: redes_db
      POSTGRES_USER: redes_user
      POSTGRES_PASSWORD: redes_password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U redes_user -d redes_db"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: redes-backend
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://redes_user:redes_password@postgres:5432/redes_db?schema=public
      CLOUDINARY_CLOUD_NAME: ${CLOUDINARY_CLOUD_NAME}
      CLOUDINARY_API_KEY: ${CLOUDINARY_API_KEY}
      CLOUDINARY_API_SECRET: ${CLOUDINARY_API_SECRET}
      JWT_SECRET: ${JWT_SECRET:-dev-secret-change-in-production}
      JWT_EXPIRATION: 86400000
      CORS_ORIGINS: http://localhost:3000,http://localhost:3001
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: redes-frontend
    ports:
      - "3000:8080"
    depends_on:
      - backend

  admin:
    build:
      context: ./admin
      dockerfile: Dockerfile
    container_name: redes-admin
    ports:
      - "3001:8080"
    depends_on:
      - backend

volumes:
  postgres_data:
